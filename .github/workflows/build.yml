name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
        channel: 'stable'

    - name: Create Flutter Project & Setup Firebase
      run: |
        flutter create --project-name finzo --org com.example temp_app
        cp -r lib temp_app/
        cp pubspec.yaml temp_app/
        
        # Firebase setup
        cp google-services.json temp_app/android/app/
        sed -i 's/apply plugin: '\''com.android.application'\''/apply plugin: '\''com.android.application'\''\napply plugin: '\''com.google.gms.google-services'\''/' temp_app/android/app/build.gradle
        sed -i 's/dependencies {/dependencies {\n    classpath '\''com.google.gms:google-services:4.4.0'\''/' temp_app/android/build.gradle
        
        cd temp_app
        flutter pub get
        flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: temp_app/build/app/outputs/flutter-apk/app-release.apk
